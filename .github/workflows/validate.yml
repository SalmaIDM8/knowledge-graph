# Runs the SHACL validation of all data files on every pull request
# and on every push to main. A red cross on the PR = the data is not valid.
name: SHACL validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshacl
      - run: python validate.py
